---
name: PR Title Check

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
    branches:
      - main
      - v*-draft

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      title-error: ${{ steps.lint-pr-title.outputs.error_message }}
      breaking-reason: ${{ steps.breaking-change.outputs.reason }}
    steps:
      - name: Validate PR title format
        id: lint-pr-title
        # continue-on-error keeps the job from failing so its outputs are
        # reliably published and the dependent jobs below can react. The
        # blocking decision is made by the block-* jobs instead.
        continue-on-error: true
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        with:
          requireScope: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ format('refs/pull/{0}/merge', github.event.pull_request.number) }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check for breaking API changes
        id: apidiff
        uses: joelanford/go-apidiff@60c4206be8f84348ebda2a3e0c3ac9cb54b8f685 # v0.8.3
        # go-apidiff exits non-zero when it detects a breaking (major) change.
        # Absorb that so the job continues and the next step decides the outcome.
        continue-on-error: true

      # Determine if this is a Release Please PR. We read labels at runtime
      # because the event payload's labels array can be empty on opened/synchronize.
      # Release PRs (autorelease: pending) are exempt from the breaking-change gate:
      # their version is already derived by release-please from properly-marked commits,
      # and re-checking API diffs against rc bumps would otherwise cause false failures.
      - name: Determine if release PR
        id: is-release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          LABELS="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(",")')"
          if [[ "$LABELS" == *"autorelease: pending"* ]]; then
            echo "is-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate breaking change marking
        id: breaking-change
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          IS_RELEASE: ${{ steps.is-release.outputs.is-release }}
          SEMVER_TYPE: ${{ steps.apidiff.outputs.semver-type }}
        run: |
          if [[ "$IS_RELEASE" == "true" ]]; then
            echo "⏭️ Skipping breaking-change validation for release-please PR"
            exit 0
          fi

          TITLE="$PR_TITLE"
          BREAKING_REGEX='^[a-z]+(\([^)]+\))?!:'
          if [[ "$TITLE" =~ $BREAKING_REGEX ]]; then
            HAS_BREAKING_MARKER="true"
          else
            HAS_BREAKING_MARKER="false"
          fi
          if [[ "$SEMVER_TYPE" == "major" ]]; then
            API_HAS_BREAKING="true"
          else
            API_HAS_BREAKING="false"
          fi

          echo "PR Title: $TITLE"
          echo "Has breaking marker (!): $HAS_BREAKING_MARKER"
          echo "API semver type: $SEMVER_TYPE"
          echo "API has breaking changes: $API_HAS_BREAKING"
          echo ""

          if [[ "$API_HAS_BREAKING" == "true" ]] && [[ "$HAS_BREAKING_MARKER" != "true" ]]; then
            echo "reason=Breaking API changes detected but PR title not marked with '!'. Example: feat!: remove deprecated method" >> "$GITHUB_OUTPUT"
            echo "❌ Breaking API changes detected but PR title not marked with '!'"
            echo "Example: feat!: remove deprecated method"
          else
            echo "✅ Breaking change marking is correct"
          fi

  # This job runs with a write-scoped token so it can post comments on fork PRs,
  # but it never checks out or builds PR-controlled code. The validate job above
  # processes the untrusted PR content with a read-only token.
  comment:
    name: Manage PR comments
    needs: validate
    # always() so this job runs even when validate needs to indicate a blocker
    # via its (always-successful) outputs rather than by failing.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Write pull request title error
        if: always() && (needs.validate.outputs.title-error != '')
        env:
          TITLE_ERROR: ${{ needs.validate.outputs.title-error }}
        run: printf '%s' "$TITLE_ERROR" > "$RUNNER_TEMP/title-error.md"

      - name: Comment on PR title format issue
        if: always() && (needs.validate.outputs.title-error != '')
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-title-format
          path: ${{ runner.temp }}/title-error.md
          message: |
            PR titles must follow the [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/) specification. Please adjust the title.

            **Format:** `type(scope): subject`
            **Common types:** `feat`, `fix`, `refactor`, `docs`, `test`, `chore`, ...
            **Breaking changes:** add `!` before the colon, e.g. `feat!: ...`

            **Examples:**
            - `feat: add support for tool calling`
            - `fix: handle nil context in streaming`
            - `feat!: remove deprecated Chat.Complete method`
            - `docs: update API documentation`

            **Details:**
            ```
            {{{content}}}
            ```

      - name: Resolve PR title format comment
        if: always() && (needs.validate.outputs.title-error == '')
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-title-format
          delete: true

      - name: Write breaking change reason
        if: always() && (needs.validate.outputs.breaking-reason != '')
        env:
          BREAKING_REASON: ${{ needs.validate.outputs.breaking-reason }}
        run: printf '%s' "$BREAKING_REASON" > "$RUNNER_TEMP/breaking-reason.md"

      - name: Comment on PR breaking change marker
        if: always() && (needs.validate.outputs.breaking-reason != '')
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-breaking-change
          path: ${{ runner.temp }}/breaking-reason.md
          message: |
            This PR introduces breaking API changes, so the title must be marked with `!` per [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/).

            **Format:** `type!: subject` or `type(scope)!: subject`

            **Examples:**
            - `feat!: remove deprecated Chat.Complete method`
            - `refactor!: rename client option`

            **Details:**
            ```
            {{{content}}}
            ```

      - name: Resolve PR breaking change comment
        if: always() && (needs.validate.outputs.breaking-reason == '')
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-breaking-change
          delete: true

  # The validate job above always succeeds; these jobs are what actually block
  # merges. Branch protection on the target branch should require these two
  # status checks. A skipped job here (when the condition is false) counts as a
  # passed required check, so merging is only blocked when the gate fires.
  block-invalid-title:
    name: Block invalid PR title
    needs: validate
    if: needs.validate.outputs.title-error != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail on invalid PR title
        env:
          TITLE_ERROR: ${{ needs.validate.outputs.title-error }}
        run: |
          echo "PR title does not follow the Conventional Commits specification:"
          printf '%s\n' "$TITLE_ERROR"
          exit 1

  block-breaking-change:
    name: Block unmarked breaking change
    needs: validate
    if: needs.validate.outputs.breaking-reason != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail on unmarked breaking change
        env:
          BREAKING_REASON: ${{ needs.validate.outputs.breaking-reason }}
        run: |
          printf '%s\n' "$BREAKING_REASON"
          exit 1
