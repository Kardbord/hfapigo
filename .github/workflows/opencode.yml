---
name: OpenCode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    name: Run OpenCode
    if: |
      (startsWith(github.event.comment.body, '/opencode ') ||
       startsWith(github.event.comment.body, '/oc ') ||
       github.event.comment.body == '/opencode' ||
       github.event.comment.body == '/oc') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Parse model from comment
        id: model
        uses: ./.github/actions/parse-model
        with:
          body: ${{ github.event.comment.body }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@7902e04c3a67f7c69726bc955efb46e29214c797 # v1.18.10
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: ${{ steps.model.outputs.model }}
          share: false
